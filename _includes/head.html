    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <meta name="author" content="{{ site.data.profile.name | escape }}" />
    <meta name="description" content="{% if page.description %}{{ page.description | strip_newlines | strip | escape }}{% else %}{{ site.description | escape }}{% endif %}" />
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <!-- Original typefaces and icon library, served locally. -->
    <link rel="stylesheet" href="{{ '/css/fonts.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/fontawesome/css/all.min.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/academicons/css/academicons.min.css' | relative_url }}" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="{{ '/css/yixuan.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/css/academic-sidebar.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/css/navigation.css' | relative_url }}" />
